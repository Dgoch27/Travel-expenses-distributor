<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Split 2</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip Split 2">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --page:#FFFFFF; --paper:#EEF3F6; --card:#FFFFFF; --ink:#0F1E30; --muted:#66788B; --line:#E2E9EF;
  --red:#D6402F; --blue:#0B2A4A; --pos:#1E7A3E; --neg:#C2372B; --tint:#E2EAF0;
  --brand:#0B2A4A; --on-brand:#FFFFFF; --hero:#0B2A4A; --accent:#7CF0C9; --on-accent:#07121D;
  --i-sand:#EFE9DF; --i-sky:#DDEBFB; --i-peach:#FDE6DA; --i-mint:#D9F5EA;
  --display:"Inter", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --body:"Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#07121D; --paper:#112131; --card:#0D1A28; --ink:#EAF2F8; --muted:#8FA3B5; --line:#1D2F42;
    --red:#F0705F; --blue:#7CF0C9; --pos:#5BD08A; --neg:#F0796E; --tint:#1B2E41;
    --brand:#7CF0C9; --on-brand:#07121D;
    --i-sand:#2B2A26; --i-sky:#1B2E4A; --i-peach:#3D2A22; --i-mint:#173B31;
  }
}
:root[data-theme="dark"]{
  --page:#07121D; --paper:#112131; --card:#0D1A28; --ink:#EAF2F8; --muted:#8FA3B5; --line:#1D2F42;
  --red:#F0705F; --blue:#7CF0C9; --pos:#5BD08A; --neg:#F0796E; --tint:#1B2E41;
  --brand:#7CF0C9; --on-brand:#07121D;
  --i-sand:#2B2A26; --i-sky:#1B2E4A; --i-peach:#3D2A22; --i-mint:#173B31;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
button,.chip,.exp,.bal-row{touch-action:manipulation}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 120px}
header.top{margin:8px 0 16px}
.trip-name{font-family:var(--display);font-weight:800;font-size:clamp(28px,8.5vw,40px);line-height:1.08;letter-spacing:-.03em;border:0;background:transparent;padding:2px 0;width:100%;min-width:0;border-bottom:2px dashed transparent}
.trip-name:hover,.trip-name:focus{border-bottom-color:var(--line);outline:none}
.ver{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ver span{font-weight:500;margin-left:4px;text-transform:none;letter-spacing:0}
.title-col{flex:1 1 320px;min-width:0}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.savebar{font-size:13px;color:var(--muted);margin-top:2px;min-height:1px}
.btn{border:1.5px solid var(--brand);background:var(--brand);color:var(--on-brand);border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer;font-size:15px}
.btn.ghost{background:var(--paper);color:var(--ink);border-color:transparent}
.btn.small{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,.exp:focus-visible,.bal-row:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
section{margin-top:30px}
h2{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0 0 4px}
.hint{color:var(--muted);font-size:14px;margin:0 0 14px}
.people{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid transparent;background:var(--paper);border-radius:999px;padding:5px 8px 5px 14px;font-weight:600;cursor:pointer}
.chip .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:6px 8px;margin:-6px -4px -6px 0}
.add-person{display:flex;gap:6px}
.add-person{flex:1 1 200px;min-width:0}
.add-person input{border:1.5px dashed var(--line);border-radius:999px;padding:9px 14px;background:transparent;flex:1;min-width:0;width:100%;font-size:16px}
.msg{color:var(--neg);font-size:14px;margin-top:8px;min-height:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px}
form.exp-form{padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
form.exp-form>*{min-width:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.row>*{min-width:0}
@media (max-width:520px){.row{grid-template-columns:minmax(0,1fr)}}
label.f{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:4px;font-size:14px;color:var(--muted);font-weight:500}
label.f input,label.f select{border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--paper);color:var(--ink);font-size:16px;width:100%;min-width:0;max-width:100%;min-height:46px}
.amount-in{font-variant-numeric:tabular-nums}
.split-head{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted);font-weight:500}
.linkbtn{border:0;background:none;color:var(--blue);cursor:pointer;font-weight:600;font-size:14px;padding:2px}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pick .chip{padding:9px 14px;min-height:40px}
.pick .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.each{font-size:14px;color:var(--muted)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.bal-row{padding:14px 16px;border-top:1px solid var(--line);cursor:pointer}
.bal-row:first-child{border-top:0}
.bal-top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:12px}
.bal-name{font-weight:600}
.bal-net{font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .zero{color:var(--muted)}
.bal-line{font-size:14px;color:var(--muted)}
.bar{position:relative;height:6px;margin-top:8px;background:var(--tint);border-radius:3px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0}
.bar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1.5px;background:var(--muted);opacity:.5}
.detail{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;display:none}
.bal-row[aria-expanded="true"] .detail{display:block}
.detail table{width:100%;border-collapse:collapse;font-size:14px}
.detail td{padding:4px 0;vertical-align:top}
.detail td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
.detail tr.sum td{border-top:1px solid var(--line);font-weight:600;padding-top:6px}
.transfers{list-style:none;margin:0;padding:0}
.transfers li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.transfers li:first-child{border-top:0}
.transfers li b{white-space:nowrap}
.t-names{display:flex;flex-wrap:wrap;align-items:baseline;min-width:0}
.t-amt{white-space:nowrap}
.transfers .t-amt{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.arrow{color:var(--red);font-weight:700;padding:0 6px}
.t-names .arrow:first-of-type{padding-left:6px}
.row.one{grid-template-columns:minmax(0,1fr)}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:baseline;padding:12px 16px;border-top:1px solid var(--line)}
.catrow:first-child{border-top:0}
.catrow b{font-family:var(--display);font-variant-numeric:tabular-nums}
.catrow .bar{grid-column:1/-1;margin-top:0}
.pct{color:var(--muted);font-size:13px;margin-left:4px}
.note{color:var(--muted);font-size:14px;margin:12px 0 0}
.h3{font-family:var(--display);font-weight:700;font-size:17px;margin:24px 0 4px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:inherit}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.grid th,.grid td{padding:10px 12px;border-top:1px solid var(--line);text-align:right;white-space:nowrap;background:var(--card);font-weight:400}
.grid thead th{border-top:0;font-weight:600;color:var(--muted);font-size:13px}
.grid tbody th,.grid tfoot th,.grid thead th:first-child{text-align:left;position:sticky;left:0;z-index:1;min-width:128px;max-width:170px;white-space:normal;font-weight:600;box-shadow:1px 0 0 var(--line)}
.grid tfoot th,.grid tfoot td{background:var(--tint);font-weight:600}
.grid tfoot tr:first-child th,.grid tfoot tr:first-child td{border-top:2px solid var(--line)}
.grid.fit th:first-child,.grid.fit td:first-child{min-width:0;max-width:none;position:static;box-shadow:none}
.grid.fit th,.grid.fit td{padding:10px 8px}
.grid.fit th:first-child{padding-left:14px}
.grid.fit th:last-child,.grid.fit td:last-child{padding-right:14px}
@media (max-width:400px){.grid.fit{font-size:13px}.grid.fit th,.grid.fit td{padding:10px 5px}.grid.fit th:first-child{padding-left:12px}.grid.fit th:last-child,.grid.fit td:last-child{padding-right:12px}}
@media (max-width:340px){.grid.fit{font-size:12px}.grid.fit th,.grid.fit td{padding:10px 4px}}
.grid tbody tr.ex-paid > *{border-top:2px solid var(--line)}
.grid tbody tr.ex-paid:first-child > *{border-top:0}
.grid tbody tr.ex-div > *{border-top:1px dashed var(--line)}
.grid tbody tr.ex-div th{font-weight:500;color:var(--muted)}
.dp{border-top:1px solid var(--line)}
.dp:first-child{border-top:0}
.dp-head{padding:14px 16px 2px;display:grid;gap:1px}
.dp-head span{color:var(--muted);font-size:13px}
.dp .transfers li{padding:8px 16px;border-top:0}
.dp .t-amt{font-size:17px}
.dp .transfers{padding-bottom:6px}
.gsub{display:block;color:var(--muted);font-size:12px;font-weight:400}
.grid .z{color:var(--muted)}
.foot{margin-top:40px;display:flex;gap:10px;flex-wrap:wrap}
.amt-row{display:flex;gap:6px}
.amt-row{align-items:stretch}
label.f .amt-row{display:flex;min-width:0}
label.f .amt-row select{width:92px;flex:0 0 92px}
label.f .amt-row input{flex:1 1 auto;width:auto;min-width:0}
.conv{white-space:nowrap}
.cur-card{padding:6px 16px 10px}
.cur-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 0;border-top:1px solid var(--line)}
.cur-row:first-child{border-top:0}
.cur-row > span:first-child{min-width:64px;font-weight:500}
.cur-row select,.rate-in input{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);color:var(--ink);font-size:16px}
.rate-in{display:flex;align-items:center;gap:6px;color:var(--muted)}
.rate-in input{width:84px;min-width:0;font-variant-numeric:tabular-nums}
.cur-row .x{flex:0 0 auto;margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;padding:0 6px}
.seg{display:flex;gap:8px;margin:0 0 12px}
.seg .chip{padding:5px 14px}
.seg .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
@media (max-width:400px){
  .wrap{padding:12px 12px 120px}
  form.exp-form{padding:14px}
  .bal-net{font-size:19px}
  .transfers .t-amt{font-size:18px}
  .form-actions .btn{flex:1 1 auto}
}
.hero{background:var(--hero);color:#fff;border-radius:28px;padding:20px 20px 18px;margin:0 0 12px;border:1px solid rgba(255,255,255,.08)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cap{font-size:12px;font-weight:700;letter-spacing:.09em;color:rgba(255,255,255,.62);text-transform:uppercase}
.hero-amt{font-size:clamp(30px,10vw,46px);font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:12px 0 16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cpills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cpill{border:0;border-radius:999px;padding:6px 13px;min-height:32px;font-weight:700;font-size:13px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.88);cursor:pointer}
.cpill[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.cpill:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.segbar{display:flex;gap:3px;height:10px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.14)}
.segbar i{display:block;min-width:4px}
.hero-legend{margin-top:10px;font-size:13px;color:rgba(255,255,255,.68);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--paper);border-radius:24px;padding:14px;display:grid;gap:2px;align-content:start;min-width:0}
.tile.lime{background:var(--accent);color:var(--on-accent)}
.tico{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;margin-bottom:12px}
.tico svg{width:18px;height:18px}
.tico.dark{background:var(--hero);color:#fff}
.tl{color:var(--muted);font-size:13px}
.tile.lime .tl{color:rgba(7,18,29,.72)}
.tv{font-size:clamp(17px,5.4vw,22px);font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere;line-height:1.2}
.ecards{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.ecard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px;cursor:pointer}
.ecard:hover{background:var(--paper)}
.ecard.editing{outline:2px solid var(--brand);outline-offset:-2px}
.ico{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:var(--ink)}
.ico svg{width:22px;height:22px}
.ico.ink{background:var(--brand);color:var(--on-brand)}
.ico.lime{background:var(--accent);color:var(--on-accent)}
.ico.sand{background:var(--i-sand)}
.ico.sky{background:var(--i-sky)}
.ico.peach{background:var(--i-peach)}
.ico.mint{background:var(--i-mint)}
.etxt{display:grid;min-width:0}
.etxt .what{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.esub{color:var(--muted);font-size:13px;line-height:1.35;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.eright{display:grid;justify-items:end;gap:5px}
.eright .amt{font-weight:800;font-size:16px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-size:12px;font-weight:600;background:var(--paper);border-radius:999px;padding:3px 10px;white-space:nowrap}
.tab-title{font-family:var(--display);font-weight:800;font-size:clamp(28px,8.5vw,40px);line-height:1.08;letter-spacing:-.03em;margin:2px 0}
.pillrow{margin:18px 0 0}
.cpills.light{justify-content:flex-start}
.cpills.light .cpill{background:var(--paper);color:var(--ink)}
.cpills.light .cpill[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,640px);z-index:10;display:grid;grid-template-columns:repeat(4,1fr);align-items:end;background:var(--page);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:transparent;color:var(--muted);display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:600;padding:2px 0;min-height:52px;cursor:pointer}
.tab .ti{width:54px;height:30px;border-radius:999px;display:grid;place-items:center}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .ti{background:var(--accent);color:var(--on-accent)}
.tab:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.add-big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:15px 18px;border:0;border-radius:20px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:16px;cursor:pointer}
.add-big svg{width:20px;height:20px}
html.noscroll,html.noscroll body{overflow:hidden}
.scrim{position:fixed;inset:0;background:rgba(7,18,29,.5);z-index:40}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,640px);max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--card);border-radius:28px 28px 0 0;z-index:41;box-shadow:0 -12px 40px rgba(0,0,0,.25)}
.sheet::before{content:"";flex:none;width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 20px 0}
.sheet-head h2{margin:0}
.x-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);font-size:24px;line-height:1;cursor:pointer}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.amt-big{display:flex;gap:8px;align-items:stretch}
.cur-sel{flex:0 0 92px;width:92px;border:0;background:var(--paper);color:var(--ink);border-radius:16px;padding:0 10px;font-size:16px;font-weight:700}
.amount-big{flex:1 1 auto;min-width:0;width:100%;border:0;background:var(--paper);color:var(--ink);border-radius:16px;padding:12px 16px;font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sh-label{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.sh-in{display:block;width:100%;min-width:0;border:0;background:var(--paper);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:16px;margin-top:10px}
.split-head .sh-label{margin:14px 0 6px}
.sheet .each{margin-top:6px}
.sheet-actions{display:flex;gap:10px;margin-top:16px}
.sheet-actions .btn{flex:1;padding:14px 16px;font-size:16px}
.msg.ok{color:var(--pos)}
@keyframes sheetUp{from{transform:translate(-50%,48px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:no-preference){.sheet.enter{animation:sheetUp .22s ease-out}.scrim.enter{animation:fadeIn .2s ease-out}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s ease,left .3s ease}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="sheet-root"></div>
<script id="app-script">
(function(){
  const APP_VERSION = 'v2.3', APP_DATE = '30 Sep 2026';   // keep in step with CACHE in sw.js
  const STORE_KEY = 'tripsplit:v1';
  const DEFAULT_STATE = {name:'Trip expenses', currency:'PHP', rates:{TWD:1.9}, view:'PHP', people:[], expenses:[]};
  const LEGACY = {airfare:'Flights',flight:'Flights',flights:'Flights',hotel:'Hotel',food:'Food',taxi:'Transport'};
  function normalize(x){
    if(!x || !Array.isArray(x.people) || !Array.isArray(x.expenses)) return null;
    if(!x.name) x.name = 'Trip expenses';
    if(!x.currency) x.currency = 'PHP';
    if(!x.rates || typeof x.rates!=='object') x.rates = {};
    if(!x.view || (x.view!==x.currency && !x.rates[x.view])) x.view = x.currency;
    delete x.settleMode;
    x.expenses.forEach(e => {
      if(!e.cat){ const k=(e.desc||'').trim().toLowerCase(); if(LEGACY[k]){ e.cat=LEGACY[k]; e.desc=''; } else e.cat='Other'; }
      if(!e.cur) e.cur = x.currency;
    });
    return x;
  }
  let state = null;
  try{ state = normalize(JSON.parse(localStorage.getItem(STORE_KEY) || 'null')); }catch(e){}
  if(!state) state = normalize(JSON.parse(JSON.stringify(DEFAULT_STATE)));
  let saveFailed = false;
  const DEFAULT_CATS = ['Food','Flights','Hotel','Transport','Activities','Shopping','Other'];
  const cats = () => [...DEFAULT_CATS, ...new Set(state.expenses.map(e=>e.cat).filter(c=>c && !DEFAULT_CATS.includes(c)))];
  const title = e => e.desc ? e.cat+': '+e.desc : e.cat;
  const ALL_CURS = ['PHP','TWD','USD','JPY','KRW','HKD','SGD','THB','VND','CNY','EUR','AUD','GBP'];
  const readOnly = false;
  let tab = 'home';
  let editingId = null, openRows = new Set(), peopleMsg = '';
  let form = blankForm();

  function blankForm(){ return {cat: state.lastCat || 'Food', catNew:'', desc:'', amount:'', cur: (state.lastCur && (state.lastCur===state.currency || state.rates[state.lastCur])) ? state.lastCur : state.currency, payer: state.people.includes(state.lastPayer) ? state.lastPayer : (state.people[0] || ''), split:[...state.people]}; }
  const app = document.getElementById('app');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const curs = () => [state.currency, ...Object.keys(state.rates)];
  const rateOf = c => c===state.currency ? 1 : (state.rates[c] || 0);
  // money in a given currency (cents of that currency)
  const fmtIn = (cents, cur) => {
    try{ return new Intl.NumberFormat('en-PH',{style:'currency',currency:cur}).format(cents/100); }
    catch(e){ return cur+' '+(cents/100).toFixed(2); }
  };
  // base-currency cents shown in the chosen report currency
  const fmt = baseCents => { const v = state.view && rateOf(state.view) ? state.view : state.currency; return fmtIn(Math.round(baseCents / rateOf(v)), v); };
  const baseCents = e => Math.round(e.amount * rateOf(e.cur) * 100);
  const origTxt = e => fmtIn(Math.round(e.amount*100), e.cur);
  const toCents = v => Math.round(parseFloat(String(v).replace(/,/g,'')) * 100);

  function persist(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); saveFailed = false; }catch(e){ saveFailed = true; }
  }

  // Split an expense in cents; leftover cents go to the first people in the list.
  function shares(exp){
    const total = baseCents(exp), n = exp.split.length, out = {};
    if(!n) return out;
    const base = Math.floor(total/n); let rem = total - base*n;
    exp.split.forEach(p => { out[p] = base + (rem > 0 ? 1 : 0); if(rem>0) rem--; });
    return out;
  }

  function compute(){
    const per = {};
    state.people.forEach(p => per[p] = {paid:0, owe:0, lines:[]});
    state.expenses.forEach(e => {
      const cents = baseCents(e), sh = shares(e), tag = e.cur!==state.view ? ' ('+origTxt(e)+')' : '';
      if(per[e.payer]){ per[e.payer].paid += cents; per[e.payer].lines.push({label:'Paid for '+title(e)+tag, v:cents}); }
      Object.entries(sh).forEach(([p,v]) => { if(per[p]){ per[p].owe += v; per[p].lines.push({label:title(e)+' share (1 of '+e.split.length+')', v:-v}); } });
    });
    state.people.forEach(p => per[p].net = per[p].paid - per[p].owe);
    return {per};
  }

  const viewCode = () => state.view && rateOf(state.view) ? state.view : state.currency;
  const toNum = c => Math.round(c / rateOf(viewCode())) / 100;   // base cents -> number in the report currency
  const numFmt = new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const nf = c => numFmt.format(toNum(c));
  const sgn = c => c>0 ? '+'+nf(c) : c<0 ? '−'+nf(-c) : '–';
  const tone = c => c>0 ? 'pos' : c<0 ? 'neg' : 'z';
  // whole-amount versions keep the summary table narrow enough for a phone
  const int0 = new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
  const nf0 = c => int0.format(Math.round(toNum(c)));
  const sgn0 = c => { const r = Math.round(toNum(c)); return r>0 ? '+'+int0.format(r) : r<0 ? '−'+int0.format(-r) : '–'; };
  const tone0 = c => tone(Math.round(toNum(c)));
  // ---- icons for the new look
  const svg = (p, w) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.8}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const IC = {
    plane: svg('<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>'),
    bed: svg('<path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"/><path d="M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4"/><path d="M12 4v6"/><path d="M2 18h20"/>'),
    fork: svg('<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>'),
    train: svg('<path d="M8 3.1V7a4 4 0 0 0 8 0V3.1"/><path d="m9 15-1-1"/><path d="m15 15 1-1"/><path d="M9 19c-2.8 0-5-2.2-5-5v-4a8 8 0 0 1 16 0v4c0 2.8-2.2 5-5 5Z"/><path d="m8 19-2 3"/><path d="m16 19 2 3"/>'),
    ticket: svg('<path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/>'),
    bag: svg('<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>'),
    tag: svg('<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>'),
    users: svg('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'),
    list: svg('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),
    arrow: svg('<path d="M7 17 17 7"/><path d="M7 7h10v10"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>', 2.2),
    home: svg('<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
    chart: svg('<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>'),
    dots: svg('<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>', 2.6)
  };
  const CAT_LOOK = {Flights:['ink','plane'], Hotel:['sand','bed'], Food:['lime','fork'], Transport:['sky','train'], Activities:['peach','ticket'], Shopping:['mint','bag'], Other:['sand','tag']};
  const catIco = c => { const [k,i] = CAT_LOOK[c] || ['sand','tag']; return `<span class="ico ${k}">${IC[i]}</span>`; };
  const SEG_COLORS = ['#7CF0C9','#FFFFFF','#5F8FBF','#3A6494'];
  const compact = c => { const v = viewCode(); try{ return new Intl.NumberFormat('en-PH',{style:'currency',currency:v,notation:'compact',maximumFractionDigits:1}).format(c/rateOf(v)/100); }catch(e){ return nf(c); } };

  // One table of numbers used by the screen, the Excel file and the Google Sheets copy.
  function tableData(){
    const {per} = compute();
    const people = state.people;
    const rows = state.expenses.map(e => {
      const sh = shares(e), cents = baseCents(e);
      return {label:title(e), sub:'Paid by '+e.payer+', '+origTxt(e), orig:origTxt(e), cur:e.cur, payer:e.payer, amount:toNum(cents), paid:cents, shares:sh, n:e.split.length,
              paidCells: people.map(p => p===e.payer ? cents : 0), shareCells: people.map(p => sh[p]||0)};
    });
    return {per, people, rows};
  }
  function overallHtml(){
    const d = tableData(), {per, people, rows} = d;
    if(!people.length || !rows.length) return '<div class="card empty">Add travellers and expenses to see the table.</div>';
    const tot = k => people.reduce((n,p)=>n+per[p][k],0);
    const summary = `<div class="tbl-wrap"><table class="grid fit"><thead><tr><th>Person</th><th>Paid</th><th>Share</th><th>Net</th></tr></thead>
      <tbody>${people.map(p=>`<tr><th scope="row">${esc(p)}</th><td>${nf0(per[p].paid)}</td><td>${nf0(per[p].owe)}</td><td class="${tone0(per[p].net)}">${sgn0(per[p].net)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><th scope="row">Total</th><td>${nf0(tot('paid'))}</td><td>${nf0(tot('owe'))}</td><td>${sgn0(tot('net'))}</td></tr></tfoot></table></div>`;
    const matrix = `<div class="tbl-wrap"><table class="grid"><thead><tr><th>Expense</th>${people.map(p=>`<th>${esc(p)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r=>`<tr class="ex-paid"><th scope="row">${esc(r.label)}<span class="gsub">${esc(r.sub)}</span></th>${r.paidCells.map(c=>`<td class="${tone(c)}">${sgn(c)}</td>`).join('')}</tr>
        <tr class="ex-div"><th scope="row">Divided by ${r.n}<span class="gsub">${fmt(Math.round(r.paid/r.n))} each</span></th>${r.shareCells.map(c=>`<td class="${tone(-c)}">${sgn(-c)}</td>`).join('')}</tr>`).join('')}</tbody>
      <tfoot>
        <tr><th scope="row">Paid</th>${people.map(p=>`<td>${nf(per[p].paid)}</td>`).join('')}</tr>
        <tr><th scope="row">Share of costs</th>${people.map(p=>`<td>${nf(per[p].owe)}</td>`).join('')}</tr>
        <tr><th scope="row">Net</th>${people.map(p=>`<td class="${tone(per[p].net)}">${sgn(per[p].net)}</td>`).join('')}</tr>
      </tfoot></table></div>`;
    return `<div class="card">${summary}</div>
      <h3 class="h3">Who paid for what</h3>
      <p class="hint">Each expense has two lines: what was paid, then how it is divided, including the payer's own share. Every column adds up to that person's net. Swipe sideways to see everyone.</p>
      <div class="card">${matrix}</div>`;
  }

  // Direct payments: each person pays the payer their share of that expense. Nothing is netted off.
  function directPayments(){
    return state.expenses.map(e => {
      const sh = shares(e);
      return {title:title(e), payer:e.payer, orig:origTxt(e),
        items: state.people.filter(p => p!==e.payer && (sh[p]||0)>0).map(p => ({from:p, to:e.payer, c:sh[p]}))};
    }).filter(g => g.items.length);
  }
  const payRow = (from, to, amtHtml) => `<li><span class="t-names"><b>${esc(from)}</b><span class="arrow">pays</span><b>${esc(to)}</b></span><span class="t-amt">${amtHtml}</span></li>`;
  function settleHtml(){
    if(!state.expenses.length) return '<div class="card empty">Nothing to settle yet.</div>';
    const g = directPayments();
    if(!g.length) return '<div class="card empty">Everyone only paid their own share.</div>';
    return `<div class="card">${g.map(x=>`<div class="dp"><div class="dp-head"><b>${esc(x.title)}</b><span>Paid by ${esc(x.payer)}, ${esc(x.orig)}</span></div><ul class="transfers">${x.items.map(i=>payRow(i.from,i.to,fmt(i.c))).join('')}</ul></div>`).join('')}</div>`;
  }

  function render(){
    const {per} = compute();
    const total = state.expenses.reduce((s,e)=>s+baseCents(e),0);
    const maxAbs = Math.max(1, ...state.people.map(p=>Math.abs(per[p].net)));
    const amt = toCents(form.amount);
    const eachTxt = eachText();
    const byCat = {}; state.expenses.forEach(e => { byCat[e.cat] = (byCat[e.cat]||0) + baseCents(e); });
    const catRows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);

    const saveTxt = saveFailed ? '<span style="color:var(--neg)">Could not save on this phone. Tap Backup below.</span>'
      : (state.people.length || state.expenses.length) ? '<span>Saved on this phone</span>' : '';

    const P = {
      header: `      <header class="top">
        <div class="ver">Trip Split ${APP_VERSION} <span>${APP_DATE}</span></div>
        <input class="trip-name" data-f="name" value="${esc(state.name)}" aria-label="Trip name" ${readOnly?'readonly':''}>
        <div class="sub">${state.people.length} travellers &bull; ${state.expenses.length} expenses</div>
        <div class="savebar" aria-live="polite">${saveTxt}</div>
      </header>

`,
      hero: `      <div class="hero">
        <div class="hero-top"><span class="cap">Total spent</span>
          ${curs().length>1 ? `<div class="cpills" role="group" aria-label="Show amounts in">${curs().map(c=>`<button class="cpill" data-act="view" data-c="${c}" aria-pressed="${c===viewCode()}">${c}</button>`).join('')}</div>` : `<span class="cap">${viewCode()}</span>`}
        </div>
        <div class="hero-amt">${fmt(total)}</div>
        <div class="segbar" aria-hidden="true">${catRows.map(([c,v],i)=>`<i style="flex:${v} 1 0;background:${SEG_COLORS[i%SEG_COLORS.length]}"></i>`).join('')}</div>
        <div class="hero-legend">${total ? catRows.slice(0,3).map(([c,v])=>esc(c)+' '+Math.round(v/total*100)+'%').join(' &bull; ') : 'No expenses yet'}</div>
      </div>
`,
      tiles: `      <div class="tiles">
        <div class="tile"><span class="tico">${IC.users}</span><span class="tl">Travellers</span><b class="tv">${state.people.length}</b></div>
        <div class="tile"><span class="tico">${IC.list}</span><span class="tl">Expenses</span><b class="tv">${state.expenses.length}</b></div>
        <div class="tile lime"><span class="tico dark">${IC.arrow}</span><span class="tl">Per person</span><b class="tv">${state.people.length && total ? compact(Math.round(total/state.people.length)) : '–'}</b></div>
      </div>

`,
      people: `      <section>
        <h2>Who's going</h2>
        <p class="hint">Everyone who might pay or share a cost.</p>
        <div class="people">
          ${state.people.map(p=>`<span class="chip" tabindex="-1">${esc(p)}${readOnly?'':`<button class="x" data-act="rm-person" data-p="${esc(p)}" aria-label="Remove ${esc(p)}">×</button>`}</span>`).join('')}
          ${readOnly?'':`<form class="add-person" data-form="person"><input name="p" placeholder="Add a name" aria-label="Add a traveller" autocomplete="off"><button class="btn small ghost">Add</button></form>`}
        </div>
        <div class="msg" role="status">${esc(peopleMsg)}</div>
      </section>

`,
      expenses: `      <section>
        <h2>Expenses</h2>
        <p class="hint">Tap an expense to edit or delete it. Each one is split equally among the people you choose.</p>
        ${state.expenses.length ? `<ul class="ecards">${state.expenses.map(e=>{
          const n = e.split.length, each = fmt(Math.round(baseCents(e)/n));
          const who = n===state.people.length ? 'everyone' : e.split.map(esc).join(', ');
          return `<li class="exp ecard ${e.id===editingId?'editing':''}" tabindex="0" data-act="edit" data-id="${e.id}">
            ${catIco(e.cat)}
            <span class="etxt"><b class="what">${esc(e.desc||e.cat)}</b><span class="esub">${esc(e.cat)} &bull; Paid by ${esc(e.payer)} &bull; Split ${who}</span></span>
            <span class="eright"><b class="amt">${origTxt(e)}</b><span class="pill">${each} each</span></span>
          </li>`; }).join('')}</ul>`
        : `<div class="card empty" style="margin-top:14px">No expenses yet. Tap Add expense to enter the first one.</div>`}
      </section>

`,
      cats: `      ${catRows.length?`<section>
        <h2>Spending by category</h2>
        <div class="card">${catRows.map(([c,v])=>`<div class="catrow"><span>${esc(c)} <span class="pct">${total?Math.round(v/total*100):0}%</span></span><b>${fmt(v)}</b><div class="bar" aria-hidden="true"><i style="left:0;width:${total?v/total*100:0}%;background:var(--brand)"></i></div></div>`).join('')}</div>
      </section>`:''}

`,
      currencies: `      <section>
        <h2>Currencies</h2>
        <p class="hint">Expenses in other currencies are converted with these rates. Update them to what you actually paid at the money changer.</p>
        <div class="card cur-card">
          <label class="cur-row"><span>Main currency</span>
            <select data-f="currency" ${readOnly?'disabled':''}>${ALL_CURS.map(c=>`<option ${c===state.currency?'selected':''}>${c}</option>`).join('')}</select></label>
          ${Object.keys(state.rates).map(c=>`<div class="cur-row"><span>1 ${c} =</span>
            <span class="rate-in"><input inputmode="decimal" data-rate="${c}" value="${state.rates[c]}" aria-label="${c} to ${state.currency} rate" ${readOnly?'readonly':''}> ${state.currency}</span>
            ${readOnly?'':`<button class="x" data-act="rm-cur" data-c="${c}" aria-label="Remove ${c}">×</button>`}</div>`).join('')}
          ${readOnly?'':`<div class="cur-row"><select data-f="addcur" aria-label="Add a currency"><option value="">Add a currency…</option>${ALL_CURS.filter(c=>!curs().includes(c)).map(c=>`<option>${c}</option>`).join('')}</select></div>`}
          <div class="msg" id="curMsg" role="status"></div>
        </div>
      </section>

`,
      balance: `      <section>
        <h2>Balance per person</h2>
        <p class="hint">What each person paid minus their shares. Green gets money back, red owes. Tap a name for the breakdown.</p>
        <div class="card">${state.people.map(p=>{
          const r = per[p], cls = r.net>0?'pos':r.net<0?'neg':'zero';
          const w = Math.abs(r.net)/maxAbs*50;
          const bar = r.net>=0 ? `left:50%;width:${w}%;background:var(--pos)` : `left:${50-w}%;width:${w}%;background:var(--neg)`;
          const open = openRows.has(p);
          return `<div class="bal-row" tabindex="0" role="button" data-act="row" data-p="${esc(p)}" aria-expanded="${open}">
            <div class="bal-top"><span class="bal-name">${esc(p)}</span><span class="bal-net ${cls}">${r.net>0?'+':''}${fmt(r.net)}</span></div>
            <div class="bal-line">Paid ${fmt(r.paid)}, share of costs ${fmt(r.owe)}. ${r.net>0?'Gets back':r.net<0?'Needs to pay':'All square'}${r.net?' '+fmt(Math.abs(r.net)):''}</div>
            <div class="bar" aria-hidden="true"><i style="${bar}"></i><span class="mid"></span></div>
            <div class="detail"><table>${r.lines.map(l=>`<tr><td>${esc(l.label)}</td><td class="n ${l.v>0?'pos':'neg'}">${l.v>0?'+':'−'}${fmt(Math.abs(l.v))}</td></tr>`).join('') || '<tr><td>No expenses involve this person yet.</td></tr>'}
              <tr class="sum"><td>Net</td><td class="n ${cls}">${r.net>0?'+':''}${fmt(r.net)}</td></tr></table></div>
          </div>`;}).join('') || '<div class="empty">Add travellers to see balances.</div>'}</div>
      </section>

`,
      overall: `      <section>
        <h2>Overall table</h2>
        <p class="hint">Everyone's payments and shares in ${viewCode()}. Share is what each person owes for the trip. Net is paid minus share: green gets money back, red owes. This summary is rounded to whole amounts; the table below and the exports keep centavos.</p>
        ${overallHtml()}
      </section>

`,
      settle: `      <section>
        <h2>Settle up</h2>
        <p class="hint">Each person pays the payer their share of that expense. Nothing is netted off.</p>
        ${settleHtml()}
      </section>

`,
      export: `      <section>
        <h2>Export</h2>
        <p class="hint">The Excel file has sheets for the summary, expenses, categories, the overall table and who pays whom. It opens in Excel, Numbers and Google Sheets.</p>
        <div class="foot" style="margin-top:0">
          <button class="btn small" data-act="xlsx">Export to Excel</button>
          <button class="btn ghost small" data-act="tsv">Copy for Google Sheets</button>
          <button class="btn ghost small" data-act="share">Share summary</button>
        </div>
        <p class="note" id="exportMsg" role="status"></p>
      </section>

`
    };
    const tabTitle = (t, sub) => `<header class="top"><div class="ver">Trip Split ${APP_VERSION} <span>${APP_DATE}</span></div><h1 class="tab-title">${t}</h1><div class="sub">${esc(sub)}</div></header>`;
    const pillRow = curs().length>1 ? `<div class="pillrow"><div class="cpills light" role="group" aria-label="Show amounts in">${curs().map(c=>`<button class="cpill" data-act="view" data-c="${c}" aria-pressed="${c===viewCode()}">${c}</button>`).join('')}</div></div>` : '';
    const dataSection = `<section>
        <h2>Trip data</h2>
        <div class="foot" style="margin-top:12px">
          <button class="btn ghost small" data-act="backup">Backup</button>

          <button class="btn ghost small" data-act="clear">Start a new trip</button>
          <input type="file" id="restoreFile" accept=".json,application/json" hidden>

    let body;

    else if(tab==='reports') body = tabTitle('Reports', state.name) + pillRow + P.cats + P.overall + P.settle;
    else if(tab==='more') body = tabTitle('More', state.name) + P.currencies + P.export + dataSection;
    else body = P.header + P.hero + P.tiles + `<button class="add-big" data-act="add">${IC.plus}<span>Add expense</span></button>` + P.expenses;
    const tabBtn = (id, label, icon) => `<button class="tab" data-act="tab" data-t="${id}" aria-current="${tab===id?'page':'false'}"><span class="ti">${icon}</span><span>${label}</span></button>`;

      lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);

  function sheetXml(rows){
    const widths = [];
    rows.forEach(r => r.forEach((c,i) => { const v = c && typeof c==='object' ? c.v : c; const len = typeof v==='number' ? 14 : String(v==null?'':v).length; widths[i] = Math.max(widths[i]||10, Math.min(42, len+2)); }));
    let x = XML+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
      +'<cols>'+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols><sheetData>';
    rows.forEach((row,ri) => {
      x += `<row r="${ri+1}">`;
      row.forEach((c,ci) => {
        if(c===null || c===undefined || c==='') return;
        const cell = typeof c==='object' ? c : {v:c}, ref = colName(ci)+(ri+1), st = cell.s ? ` s="${cell.s}"` : '';
        x += typeof cell.v==='number' ? `<c r="${ref}"${st}><v>${cell.v}</v></c>` : `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(cell.v)}</t></is></c>`;
      });
      x += '</row>';
    });
    return x+'</sheetData></worksheet>';
  }
  function buildXlsx(sheets){
    const R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships', files = [];
    files.push(['[Content_Types].xml', XML+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      +sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')
      +'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>']);
    files.push(['_rels/.rels', XML+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`]);
    files.push(['xl/workbook.xml', XML+`<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${R}"><sheets>`
      +sheets.map((s,i)=>`<sheet name="${xmlEsc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>']);
    files.push(['xl/_rels/workbook.xml.rels', XML+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      +sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="${R}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')
      +`<Relationship Id="rId${sheets.length+1}" Type="${R}/styles" Target="styles.xml"/></Relationships>`]);
    files.push(['xl/styles.xml', STYLES]);
    sheets.forEach((s,i) => files.push([`xl/worksheets/sheet${i+1}.xml`, sheetXml(s.rows)]));
    const enc = new TextEncoder();
    return zipStore(files.map(([name,text]) => ({name, data: enc.encode(text)})));
  }
  function sheetsData(){
    const d = tableData(), cur = viewCode(), {per, people, rows} = d, n = toNum;
    const H = v => ({v, s:1}), N = v => ({v, s:2}), NB = v => ({v, s:3}), B = v => ({v, s:4});
    const tot = k => people.reduce((a,p)=>a+per[p][k],0);
    const total = state.expenses.reduce((a,e)=>a+baseCents(e),0);
    const summary = [[H('Person'), H('Paid ('+cur+')'), H('Share of costs ('+cur+')'), H('Net ('+cur+', + gets back)')],
      ...people.map(p => [p, N(n(per[p].paid)), N(n(per[p].owe)), N(n(per[p].net))]),
      [B('Total'), NB(n(tot('paid'))), NB(n(tot('owe'))), NB(n(tot('net')))]];
    const expenses = [[H('#'),H('Category'),H('Details'),H('Paid by'),H('Currency'),H('Amount'),H('Rate to '+cur),H('Amount ('+cur+')'),H('Split among'),H('Share each ('+cur+')')],
      ...state.expenses.map((e,i) => [i+1, e.cat, e.desc||'', e.payer, e.cur, N(e.amount), {v:+(rateOf(e.cur)/rateOf(cur)).toFixed(6), s:6}, N(n(baseCents(e))), e.split.join(', '), N(n(Math.round(baseCents(e)/(e.split.length||1))))]),
      [B('Total'),'','','','','','',NB(n(total))]];
    const byCat = {}; state.expenses.forEach(e => { byCat[e.cat] = (byCat[e.cat]||0) + baseCents(e); });
    const cats = [[H('Category'), H('Amount ('+cur+')'), H('Share of trip')],
      ...Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v]) => [c, N(n(v)), {v:total?+(v/total).toFixed(4):0, s:5}]),
      [B('Total'), NB(n(total))]];
    const matrix = [[H('Expense'), H('Paid by'), H('Amount paid ('+cur+')'), ...people.map(H)],
      ...rows.flatMap(r => [[r.label, r.payer, N(r.amount), ...r.paidCells.map(c=>N(n(c)))],
                            ['Divided by '+r.n, '', '', ...r.shareCells.map(c=>N(-n(c)))]]),
      [B('Paid'),'','', ...people.map(p=>NB(n(per[p].paid)))],
      [B('Share of costs'),'','', ...people.map(p=>NB(n(per[p].owe)))],
      [B('Net (+ gets back)'),'','', ...people.map(p=>NB(n(per[p].net)))]];
    const direct = [[H('Expense'), H('From'), H('To'), H('Amount ('+cur+')')]];
    directPayments().forEach(g => g.items.forEach(i => direct.push([g.title, i.from, i.to, N(n(i.c))])));
    if(direct.length===1) direct.push(['Everyone only paid their own share','','','']);
    return [{name:'Summary', rows:summary},{name:'Expenses', rows:expenses},{name:'By category', rows:cats},{name:'Who paid for what', rows:matrix},{name:'Direct payments', rows:direct}];
  }
  function exportXlsx(){
    if(!state.expenses.length){ note('Add an expense first.', 'exportMsg'); return; }
    let blob; try{ blob = buildXlsx(sheetsData()); }catch(e){ note('Could not build the Excel file. Try Copy for Google Sheets instead.', 'exportMsg'); return; }
    saveFile(blob, fileBase()+'.xlsx', 'exportMsg');
  }

  function restore(input){
    const f = input.files && input.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      let x = null; try{ x = normalize(JSON.parse(r.result)); }catch(e){}
      if(!x){ note('That file is not a Trip Split backup.'); return; }
      if(!confirm('Replace what is on this phone with "'+x.name+'" ('+x.expenses.length+' expenses)?')){ input.value=''; return; }
      state = x; editingId = null; form = blankForm(); openRows.clear(); persist(); render(); note('Backup restored.');
    };
    r.onerror = () => note('Could not read that file.');
    r.readAsText(f);
  }

  document.title = state.name || 'Trip Split';
  render();
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
