<style id="app-style">

  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;

  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10161F; --card:#18202B; --ink:#E7ECF3; --muted:#93A0B2; --line:#2A3544;
    --red:#E0545C; --blue:#6E9BE8; --pos:#4FC08A; --neg:#EE6B68; --tint:#1D2A3B;
  }
}
:root[data-theme="dark"]{
  --paper:#10161F; --card:#18202B; --ink:#E7ECF3; --muted:#93A0B2; --line:#2A3544;
  --red:#E0545C; --blue:#6E9BE8; --pos:#4FC08A; --neg:#EE6B68; --tint:#1D2A3B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
button,.chip,.exp,.bal-row{touch-action:manipulation}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.airmail{height:10px;background:repeating-linear-gradient(-45deg,var(--red) 0 14px,transparent 14px 22px,var(--blue) 22px 36px,transparent 36px 44px)}

header.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;margin:10px 0 22px}
.trip-name{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,46px);line-height:1.05;letter-spacing:-.02em;border:0;background:transparent;padding:2px 0;width:100%;min-width:0;border-bottom:2px dashed transparent}
.trip-name:hover,.trip-name:focus{border-bottom-color:var(--line);outline:none}
.title-col{flex:1 1 320px;min-width:0}
.sub{color:var(--muted);font-size:14px;margin-top:4px}

.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}

section{margin-top:30px}

.conv{white-space:nowrap}

.cur-row select,.rate-in input{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);color:var(--ink);font-size:16px}

.rate-in input{width:84px;min-width:0;font-variant-numeric:tabular-nums}

  .wrap{padding:14px 12px 48px}
  form.exp-form{padding:14px}

@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s ease,left .3s ease}}

<body>
<div class="airmail" aria-hidden="true"></div>
<div id="app" class="wrap"></div>
<script id="app-script">
(function(){
  const STORE_KEY = 'tripsplit:v1';
  const DEFAULT_STATE = {name:'Trip expenses', currency:'PHP', rates:{TWD:1.9}, view:'PHP', people:[], expenses:[]};
  const LEGACY = {airfare:'Flights',flight:'Flights',flights:'Flights',hotel:'Hotel',food:'Food',taxi:'Transport'};
  function normalize(x){
    if(!x || !Array.isArray(x.people) || !Array.isArray(x.expenses)) return null;
    if(!x.name) x.name = 'Trip expenses';
    if(!x.currency) x.currency = 'PHP';
    if(!x.rates || typeof x.rates!=='object') x.rates = {};
    if(!x.view || (x.view!==x.currency && !x.rates[x.view])) x.view = x.currency;
    x.expenses.forEach(e => {
      if(!e.cat){ const k=(e.desc||'').trim().toLowerCase(); if(LEGACY[k]){ e.cat=LEGACY[k]; e.desc=''; } else e.cat='Other'; }
      if(!e.cur) e.cur = x.currency;
    });
    return x;
  }
  let state = null;
  try{ state = normalize(JSON.parse(localStorage.getItem(STORE_KEY) || 'null')); }catch(e){}
  if(!state) state = normalize(JSON.parse(JSON.stringify(DEFAULT_STATE)));
  let saveFailed = false;
  const DEFAULT_CATS = ['Food','Flights','Hotel','Transport','Activities','Shopping','Other'];
  const cats = () => [...DEFAULT_CATS, ...new Set(state.expenses.map(e=>e.cat).filter(c=>c && !DEFAULT_CATS.includes(c)))];
  const title = e => e.desc ? e.cat+': '+e.desc : e.cat;
  const ALL_CURS = ['PHP','TWD','USD','JPY','KRW','HKD','SGD','THB','VND','CNY','EUR','AUD','GBP'];
  const readOnly = false;
  let editingId = null, openRows = new Set(), peopleMsg = '';
  let form = blankForm();

  function blankForm(){ return {cat: state.lastCat || 'Food', catNew:'', desc:'', amount:'', cur: state.lastCur || state.currency, payer: state.people[0] || '', split:[...state.people]}; }
  const app = document.getElementById('app');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const curs = () => [state.currency, ...Object.keys(state.rates)];
  const rateOf = c => c===state.currency ? 1 : (state.rates[c] || 0);
  // money in a given currency (cents of that currency)
  const fmtIn = (cents, cur) => {
    try{ return new Intl.NumberFormat('en-PH',{style:'currency',currency:cur}).format(cents/100); }
    catch(e){ return cur+' '+(cents/100).toFixed(2); }
  };
  // base-currency cents shown in the chosen report currency
  const fmt = baseCents => { const v = state.view && rateOf(state.view) ? state.view : state.currency; return fmtIn(Math.round(baseCents / rateOf(v)), v); };
  const baseCents = e => Math.round(e.amount * rateOf(e.cur) * 100);
  const origTxt = e => fmtIn(Math.round(e.amount*100), e.cur);
  const toCents = v => Math.round(parseFloat(String(v).replace(/,/g,'')) * 100);

  function persist(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); saveFailed = false; }catch(e){ saveFailed = true; }
  }

  // Split an expense in cents; leftover cents go to the first people in the list.
  function shares(exp){
    const total = baseCents(exp), n = exp.split.length, out = {};
    if(!n) return out;
    const base = Math.floor(total/n); let rem = total - base*n;
    exp.split.forEach(p => { out[p] = base + (rem > 0 ? 1 : 0); if(rem>0) rem--; });
    return out;
  }

  function compute(){
    const per = {};
    state.people.forEach(p => per[p] = {paid:0, owe:0, lines:[]});
    state.expenses.forEach(e => {
      const cents = baseCents(e), sh = shares(e), tag = e.cur!==state.view ? ' ('+origTxt(e)+')' : '';
      if(per[e.payer]){ per[e.payer].paid += cents; per[e.payer].lines.push({label:'Paid for '+title(e)+tag, v:cents}); }
      Object.entries(sh).forEach(([p,v]) => { if(per[p]){ per[p].owe += v; per[p].lines.push({label:title(e)+' share (1 of '+e.split.length+')', v:-v}); } });
    });
    state.people.forEach(p => per[p].net = per[p].paid - per[p].owe);
    // Settle: largest debtor pays largest creditor until everyone is even.
    const cred = state.people.filter(p=>per[p].net>0).map(p=>({p,v:per[p].net})).sort((a,b)=>b.v-a.v);
    const debt = state.people.filter(p=>per[p].net<0).map(p=>({p,v:-per[p].net})).sort((a,b)=>b.v-a.v);
    const transfers = []; let i=0,j=0;
    while(i<debt.length && j<cred.length){
      const x = Math.min(debt[i].v, cred[j].v);
      if(x>0) transfers.push({from:debt[i].p, to:cred[j].p, v:x});
      debt[i].v -= x; cred[j].v -= x;
      if(debt[i].v===0) i++; if(cred[j].v===0) j++;
    }
    return {per, transfers};
  }

  const viewCode = () => state.view && rateOf(state.view) ? state.view : state.currency;
  const toNum = c => Math.round(c / rateOf(viewCode())) / 100;   // base cents -> number in the report currency
  const numFmt = new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const nf = c => numFmt.format(toNum(c));
  const sgn = c => c>0 ? '+'+nf(c) : c<0 ? '−'+nf(-c) : '–';
  const tone = c => c>0 ? 'pos' : c<0 ? 'neg' : 'z';
  // whole-amount versions keep the summary table narrow enough for a phone
  const int0 = new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
  const nf0 = c => int0.format(Math.round(toNum(c)));
  const sgn0 = c => { const r = Math.round(toNum(c)); return r>0 ? '+'+int0.format(r) : r<0 ? '−'+int0.format(-r) : '–'; };
  const tone0 = c => tone(Math.round(toNum(c)));
  const segHtml = () => curs().length>1 ? `<div class="seg" role="group" aria-label="Show amounts in">${curs().map(c=>`<button class="chip" data-act="view" data-c="${c}" aria-pressed="${c===state.view}">In ${c}</button>`).join('')}</div>` : '';

  // One table of numbers used by the screen, the Excel file and the Google Sheets copy.
  function tableData(){
    const {per, transfers} = compute();
    const people = state.people;
    const rows = state.expenses.map(e => {
      const sh = shares(e), cents = baseCents(e);
      return {label:title(e), sub:'Paid by '+e.payer+', '+origTxt(e), payer:e.payer, amount:toNum(cents),
              cells: people.map(p => (p===e.payer ? cents : 0) - (sh[p]||0))};
    });
    return {per, transfers, people, rows};
  }
  function overallHtml(){
    const d = tableData(), {per, people, rows} = d;
    if(!people.length || !rows.length) return '<div class="card empty">Add travelers and expenses to see the table.</div>';
    const tot = k => people.reduce((n,p)=>n+per[p][k],0);
    const summary = `<div class="tbl-wrap"><table class="grid fit"><thead><tr><th>Person</th><th>Paid</th><th>Share</th><th>Net</th></tr></thead>
      <tbody>${people.map(p=>`<tr><th scope="row">${esc(p)}</th><td>${nf0(per[p].paid)}</td><td>${nf0(per[p].owe)}</td><td class="${tone0(per[p].net)}">${sgn0(per[p].net)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><th scope="row">Total</th><td>${nf0(tot('paid'))}</td><td>${nf0(tot('owe'))}</td><td>${sgn0(tot('net'))}</td></tr></tfoot></table></div>`;
    const matrix = `<div class="tbl-wrap"><table class="grid"><thead><tr><th>Expense</th>${people.map(p=>`<th>${esc(p)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r=>`<tr><th scope="row">${esc(r.label)}<span class="gsub">${esc(r.sub)}</span></th>${r.cells.map(c=>`<td class="${tone(c)}">${sgn(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      <tfoot>
        <tr><th scope="row">Paid</th>${people.map(p=>`<td>${nf(per[p].paid)}</td>`).join('')}</tr>
        <tr><th scope="row">Share of costs</th>${people.map(p=>`<td>${nf(per[p].owe)}</td>`).join('')}</tr>
        <tr><th scope="row">Net</th>${people.map(p=>`<td class="${tone(per[p].net)}">${sgn(per[p].net)}</td>`).join('')}</tr>
      </tfoot></table></div>`;
    return `<div class="card">${summary}</div>
      <h3 class="h3">Who paid for what</h3>
      <p class="hint">Each cell is what that person paid minus their share of that expense. Every column adds up to that person's net. Swipe sideways to see everyone.</p>
      <div class="card">${matrix}</div>`;
  }

  function render(){
    const {per, transfers} = compute();
    const total = state.expenses.reduce((s,e)=>s+baseCents(e),0);
    const maxAbs = Math.max(1, ...state.people.map(p=>Math.abs(per[p].net)));
    const amt = toCents(form.amount);
    const eachTxt = eachText();

        ${readOnly?'':`
        <form class="card exp-form" data-form="expense">
          <div class="row">
            <label class="f">Category<select data-ff="cat">${cats().map(c=>`<option ${c===form.cat?'selected':''}>${esc(c)}</option>`).join('')}<option value="__new" ${form.cat==='__new'?'selected':''}>New category…</option></select></label>
            <label class="f">Details, optional<input data-ff="desc" value="${esc(form.desc)}" placeholder="Din Tai Fung" autocomplete="off"></label>

          <div class="row one">

          <div>
            <div class="split-head"><span>Split equally among</span>
              <span><button type="button" class="linkbtn" data-act="all">Everyone</button> <button type="button" class="linkbtn" data-act="none">Clear</button></span>

            <div class="pick">${state.people.map(p=>`<button type="button" class="chip" data-act="toggle" data-p="${esc(p)}" aria-pressed="${form.split.includes(p)}">${esc(p)}</button>`).join('')}</div>

        ${state.expenses.length ? `<ul class="exp-list card">${state.expenses.map(e=>`
          <li class="exp ${e.id===editingId?'editing':''}" tabindex="0" data-act="edit" data-id="${e.id}">
            <span class="what"><span class="cat">${esc(e.cat)}</span>${esc(e.desc)}</span><span class="amt">${origTxt(e)}</span>
            <span class="who">Paid by ${esc(e.payer)}, split ${e.split.length===state.people.length?'among everyone':'with '+e.split.map(esc).join(', ')} (${fmt(Math.round(baseCents(e)/e.split.length))} each)${e.cur!==state.view?' <span class="conv">≈ '+fmt(baseCents(e))+'</span>':''}</span>

  }

  function flash(id, text){ const el = document.getElementById(id); if(el) el.textContent = text; }

  app.addEventListener('input', e => {
    const t = e.target;
    if(t.dataset.ff){ form[t.dataset.ff] = t.value; if(t.dataset.ff==='amount'){ const each=app.querySelector('.each'); if(each) each.textContent = eachText(); } }
    if(t.dataset.rate){ const v = parseFloat(t.value); if(v>0){ state.rates[t.dataset.rate] = v; persist(); refreshKeepFocus(t); } }
    if(t.dataset.f==='name'){ state.name = t.value; persist(); document.title = t.value || 'Trip Split'; updateSaveBar(); }
  });
  app.addEventListener('change', e => {
    const t = e.target;
    if(t.id==='restoreFile'){ restore(t); return; }
    if(t.dataset.ff==='payer') form.payer = t.value;
    if(t.dataset.ff==='cat'){ form.cat = t.value; if(t.value!=='__new') state.lastCat = t.value; render(); if(t.value==='__new'){ const n = app.querySelector('[data-ff="catNew"]'); if(n) n.focus(); } }
    if(t.dataset.ff==='cur'){ form.cur = t.value; state.lastCur = t.value; render(); }
    if(t.dataset.f==='currency') changeBase(t.value);
    if(t.dataset.f==='addcur' && t.value){ state.rates[t.value] = 1; persist(); render(); const n = app.querySelector(`[data-rate="${t.value}"]`); if(n){ n.focus(); n.select(); } }
  });

  function eachText(){
    const amt = toCents(form.amount), n = form.split.length;
    if(!(amt>0) || !n) return '';
    let t = fmtIn(Math.round(amt/n), form.cur)+' each';
    if(form.cur!==state.currency) t += ' (≈ '+fmtIn(Math.round(amt*rateOf(form.cur)/n), state.currency)+')';
    return t;
  }
  function refreshKeepFocus(el){
    const sel = el.dataset.rate ? `[data-rate="${el.dataset.rate}"]` : null, pos = el.selectionStart;
    render(); if(sel){ const n = app.querySelector(sel); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } }
  }
  // Switching the main currency re-expresses every rate against the new one.
  function changeBase(nb){
    const k = rateOf(nb) || 0;
    if(!k){ // brand-new currency: needs a rate before it can be main
      state.rates[nb] = 1;
      flash('curMsg', 'Set the rate for '+nb+' first, then make it the main currency.'); persist(); render(); return;
    }
    const old = state.currency, rates = {};
    Object.keys(state.rates).forEach(c => { if(c!==nb) rates[c] = +(state.rates[c]/k).toPrecision(6); });
    rates[old] = +(1/k).toPrecision(6);
    state.currency = nb; state.rates = rates; if(!curs().includes(state.view)) state.view = nb;
    persist(); render();
  }
  function updateSaveBar(){
    // Re-render only the save bar so the title input keeps focus while typing.
    const bar = app.querySelector('.savebar'); if(!bar) return;
    const keep = document.activeElement;
    render(); if(keep && keep.dataset && keep.dataset.f==='name'){ const n = app.querySelector('.trip-name'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); }
  }

  app.addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target.dataset.form;
    if(f==='person'){
      const name = e.target.p.value.trim();
      peopleMsg = '';
      if(!name) return;
      if(state.people.some(p=>p.toLowerCase()===name.toLowerCase())){ peopleMsg = name+' is already on the list.'; render(); return; }
      state.people.push(name);
      if(!editingId) form.split.push(name);
      if(!form.payer) form.payer = name;
      persist(); render();
      const inp = app.querySelector('.add-person input'); if(inp) inp.focus();
    }
    if(f==='expense'){
      const amt = toCents(form.amount);
      let cat = form.cat==='__new' ? (form.catNew||'').trim() : form.cat;
      if(!cat) return flash('formMsg','Name the new category, or pick one from the list.');
      cat = cats().find(c=>c.toLowerCase()===cat.toLowerCase()) || (cat.charAt(0).toUpperCase()+cat.slice(1));
      if(!(amt>0)) return flash('formMsg','Enter an amount above zero.');
      if(!form.split.length) return flash('formMsg','Pick at least one person to share it.');
      const data = {cat, desc:form.desc.trim(), amount:amt/100, cur:form.cur, payer:form.payer, split:state.people.filter(p=>form.split.includes(p))};
      if(editingId){ Object.assign(state.expenses.find(x=>x.id===editingId), data); editingId = null; }
      else state.expenses.push({id:'e'+Date.now().toString(36), ...data});
      state.lastCat = cat; form = blankForm(); persist(); render();
    }
  });

  app.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if(!t) return;
    const act = t.dataset.act, p = t.dataset.p;
    if(act==='rm-person'){
      e.stopPropagation();
      const n = state.expenses.filter(x=>x.payer===p || x.split.includes(p)).length;
      if(n){ peopleMsg = p+' is in '+n+' expense'+(n>1?'s':'')+'. Edit or delete those first.'; render(); return; }
      state.people = state.people.filter(x=>x!==p); form.split = form.split.filter(x=>x!==p);
      if(form.payer===p) form.payer = state.people[0]||''; peopleMsg=''; persist(); render();
    }
    else if(act==='toggle'){ form.split = form.split.includes(p) ? form.split.filter(x=>x!==p) : [...form.split,p]; render(); }
    else if(act==='all'){ form.split = [...state.people]; render(); }
    else if(act==='none'){ form.split = []; render(); }
    else if(act==='edit' && !readOnly){
      const x = state.expenses.find(z=>z.id===t.dataset.id);
      editingId = x.id; form = {cat:x.cat, catNew:'', desc:x.desc||'', amount:String(x.amount), cur:x.cur, payer:x.payer, split:[...x.split]}; render();
      app.querySelector('.exp-form').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start'});
    }
    else if(act==='cancel'){ editingId=null; form=blankForm(); render(); }
    else if(act==='del-exp'){ state.expenses = state.expenses.filter(x=>x.id!==editingId); editingId=null; form=blankForm(); persist(); render(); }
    else if(act==='row'){ openRows.has(p)?openRows.delete(p):openRows.add(p); render(); }
    else if(act==='clear'){
      if(!confirm('Remove all travelers and expenses and start over?')) return;
      state = {name:'New trip', currency:state.currency, rates:state.rates, view:state.view, people:[], expenses:[]};
      editingId=null; form=blankForm(); openRows.clear(); persist(); render();
    }
    else if(act==='share') shareSummary();
    else if(act==='xlsx') exportXlsx();
    else if(act==='tsv') copyForSheets();
    else if(act==='backup') backup();
    else if(act==='restore'){ const f = app.querySelector('#restoreFile'); if(f) f.click(); }
    else if(act==='view'){ state.view = t.dataset.c; persist(); render(); }
    else if(act==='rm-cur'){
      const c = t.dataset.c, n = state.expenses.filter(x=>x.cur===c).length;
      if(n){ flash('curMsg', n+' expense'+(n>1?'s are':' is')+' in '+c+'. Change or delete '+(n>1?'those':'it')+' first.'); return; }
      delete state.rates[c]; if(state.view===c) state.view = state.currency; if(form.cur===c) form.cur = state.currency; if(state.lastCur===c) delete state.lastCur;
      persist(); render();
    }
  });
  app.addEventListener('keydown', e => {
    if((e.key==='Enter'||e.key===' ') && e.target.matches('.exp,.bal-row')){ e.preventDefault(); e.target.click(); }
  });

  function note(text, id){ const el = document.getElementById(id || 'footMsg'); if(el) el.textContent = text; }

  async function copyText(text){
    try{ await navigator.clipboard.writeText(text); return true; }
    catch(e){
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); let ok = false; try{ ok = document.execCommand('copy'); }catch(_){} ta.remove(); return ok;
    }
  }
  // Share sheet when the phone offers one (Save to Files, Numbers, Sheets...), otherwise a normal download.
  async function saveFile(blob, name, msgId){
    try{
      const file = new File([blob], name, {type: blob.type});
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
    }catch(e){ if(e && e.name==='AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    note('Saved as '+name+'.', msgId);
  }
  const fileBase = () => (state.name||'trip').replace(/[^\w]+/g,'-').replace(/^-|-$/g,'') || 'trip';

  function summaryText(){
    const {per, transfers} = compute();
    const total = state.expenses.reduce((n,e)=>n+baseCents(e),0);
    let t = state.name+'\n'+fmt(total)+' total\n\nBalances\n';
    state.people.forEach(p => { const n = per[p].net;
      t += p+': '+(n>0?'gets back '+fmt(n):n<0?'pays '+fmt(-n):'even')+'\n'; });
    t += '\nSettle up\n';
    t += transfers.length ? transfers.map(x => x.from+' pays '+x.to+' '+fmt(x.v)).join('\n') : 'Everyone is even.';
    return t;
  }
  async function shareSummary(){
    if(!state.expenses.length){ note('Add an expense first.', 'exportMsg'); return; }
    const text = summaryText();
    if(navigator.share){
      try{ await navigator.share({title:state.name, text}); return; }
      catch(e){ if(e && e.name==='AbortError') return; }
    }
    note(await copyText(text) ? 'Summary copied. Paste it into your group chat.' : 'Could not copy. Select the balances and copy them by hand.', 'exportMsg');
  }
  function backup(){
    saveFile(new Blob([JSON.stringify(state, null, 2)], {type:'application/json'}), fileBase()+'-backup.json', 'footMsg');
  }

  // ---- Google Sheets: tab-separated text pastes straight into a sheet
  async function copyForSheets(){
    if(!state.expenses.length){ note('Add an expense first.', 'exportMsg'); return; }
    const d = tableData(), cur = viewCode(), f = c => toNum(c).toFixed(2);
    const lines = [['Expense','Paid by','Amount ('+cur+')', ...d.people]];
    d.rows.forEach(r => lines.push([r.label, r.payer, r.amount.toFixed(2), ...r.cells.map(f)]));
    lines.push(['Paid','','', ...d.people.map(p=>f(d.per[p].paid))]);
    lines.push(['Share of costs','','', ...d.people.map(p=>f(d.per[p].owe))]);
    lines.push(['Net','','', ...d.people.map(p=>f(d.per[p].net))]);
    const text = lines.map(r => r.map(x => String(x).replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n');
    note(await copyText(text) ? 'Copied. In Google Sheets, tap a cell and paste.' : 'Could not copy. Use Export to Excel instead.', 'exportMsg');
  }

  // ---- Excel: a small .xlsx writer (no libraries, works offline)
  const crcTable = (() => { const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
  const crc32 = u8 => { let c = 0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = crcTable[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
  function zipStore(files){
    const enc = new TextEncoder(), d = new Date(), chunks = [], central = []; let offset = 0;
    const dt = ((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(), tm = (d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
    files.forEach(f => {
      const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
      lh.setUint16(10,tm,true); lh.setUint16(12,dt,true); lh.setUint32(14,crc,true); lh.setUint32(18,size,true); lh.setUint32(22,size,true);
      lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
      chunks.push(new Uint8Array(lh.buffer), name, f.data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
      ch.setUint16(12,tm,true); ch.setUint16(14,dt,true); ch.setUint32(16,crc,true); ch.setUint32(20,size,true); ch.setUint32(24,size,true);
      ch.setUint16(28,name.length,true); ch.setUint32(42,offset,true);
      central.push(new Uint8Array(ch.buffer), name);
      offset += 30 + name.length + size;
    });
    const cdSize = central.reduce((n,c)=>n+c.length,0), end = new DataView(new ArrayBuffer(22));
    end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,cdSize,true); end.setUint32(16,offset,true);
    return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  }
  const XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const xmlEsc = t => String(t).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const colName = i => { let s='', n=i+1; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; };
  // cell styles: 1 header, 2 number, 3 bold number, 4 bold text, 5 percent, 6 rate
  const STYLES = XML+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="0.0000"/></numFmts>'
    +'<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'
    +'<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEDF2FA"/><bgColor indexed="64"/></patternFill></fill></fills>'
    +'<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
    +'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
    +'<cellXfs count="7"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
    +'<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>'
    +'<xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'
    +'<xf numFmtId="4" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/>'
    +'<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>'
    +'<xf numFmtId="9" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'
    +'<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs>'
    +'<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
  function sheetXml(rows){
    const widths = [];
    rows.forEach(r => r.forEach((c,i) => { const v = c && typeof c==='object' ? c.v : c; const len = typeof v==='number' ? 14 : String(v==null?'':v).length; widths[i] = Math.max(widths[i]||10, Math.min(42, len+2)); }));
    let x = XML+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'
      +'<cols>'+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols><sheetData>';
    rows.forEach((row,ri) => {
      x += `<row r="${ri+1}">`;
      row.forEach((c,ci) => {
        if(c===null || c===undefined || c==='') return;
        const cell = typeof c==='object' ? c : {v:c}, ref = colName(ci)+(ri+1), st = cell.s ? ` s="${cell.s}"` : '';
        x += typeof cell.v==='number' ? `<c r="${ref}"${st}><v>${cell.v}</v></c>` : `<c r="${ref}"${st} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(cell.v)}</t></is></c>`;
      });
      x += '</row>';
    });
    return x+'</sheetData></worksheet>';
  }
  function buildXlsx(sheets){
    const R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships', files = [];
    files.push(['[Content_Types].xml', XML+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      +sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')
      +'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>']);
    files.push(['_rels/.rels', XML+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`]);
    files.push(['xl/workbook.xml', XML+`<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${R}"><sheets>`
      +sheets.map((s,i)=>`<sheet name="${xmlEsc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>']);
    files.push(['xl/_rels/workbook.xml.rels', XML+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      +sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="${R}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')
      +`<Relationship Id="rId${sheets.length+1}" Type="${R}/styles" Target="styles.xml"/></Relationships>`]);
    files.push(['xl/styles.xml', STYLES]);
    sheets.forEach((s,i) => files.push([`xl/worksheets/sheet${i+1}.xml`, sheetXml(s.rows)]));
    const enc = new TextEncoder();
    return zipStore(files.map(([name,text]) => ({name, data: enc.encode(text)})));
  }
  function sheetsData(){
    const d = tableData(), cur = viewCode(), {per, transfers, people, rows} = d, n = toNum;
    const H = v => ({v, s:1}), N = v => ({v, s:2}), NB = v => ({v, s:3}), B = v => ({v, s:4});
    const tot = k => people.reduce((a,p)=>a+per[p][k],0);
    const total = state.expenses.reduce((a,e)=>a+baseCents(e),0);
    const summary = [[H('Person'), H('Paid ('+cur+')'), H('Share of costs ('+cur+')'), H('Net ('+cur+', + gets back)')],
      ...people.map(p => [p, N(n(per[p].paid)), N(n(per[p].owe)), N(n(per[p].net))]),
      [B('Total'), NB(n(tot('paid'))), NB(n(tot('owe'))), NB(n(tot('net')))]];
    const expenses = [[H('#'),H('Category'),H('Details'),H('Paid by'),H('Currency'),H('Amount'),H('Rate to '+cur),H('Amount ('+cur+')'),H('Split among'),H('Share each ('+cur+')')],
      ...state.expenses.map((e,i) => [i+1, e.cat, e.desc||'', e.payer, e.cur, N(e.amount), {v:+(rateOf(e.cur)/rateOf(cur)).toFixed(6), s:6}, N(n(baseCents(e))), e.split.join(', '), N(n(Math.round(baseCents(e)/(e.split.length||1))))]),
      [B('Total'),'','','','','','',NB(n(total))]];
    const byCat = {}; state.expenses.forEach(e => { byCat[e.cat] = (byCat[e.cat]||0) + baseCents(e); });
    const cats = [[H('Category'), H('Amount ('+cur+')'), H('Share of trip')],
      ...Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v]) => [c, N(n(v)), {v:total?+(v/total).toFixed(4):0, s:5}]),
      [B('Total'), NB(n(total))]];
    const matrix = [[H('Expense'), H('Paid by'), H('Amount ('+cur+')'), ...people.map(H)],
      ...rows.map(r => [r.label, r.payer, N(r.amount), ...r.cells.map(c=>N(n(c)))]),
      [B('Paid'),'','', ...people.map(p=>NB(n(per[p].paid)))],
      [B('Share of costs'),'','', ...people.map(p=>NB(n(per[p].owe)))],
      [B('Net (+ gets back)'),'','', ...people.map(p=>NB(n(per[p].net)))]];
    const settle = [[H('From'), H('To'), H('Amount ('+cur+')')],
      ...(transfers.length ? transfers.map(t => [t.from, t.to, N(n(t.v))]) : [['Everyone is even','','']])];
    return [{name:'Summary', rows:summary},{name:'Expenses', rows:expenses},{name:'By category', rows:cats},{name:'Who paid for what', rows:matrix},{name:'Settle up', rows:settle}];
  }
  function exportXlsx(){
    if(!state.expenses.length){ note('Add an expense first.', 'exportMsg'); return; }
    let blob; try{ blob = buildXlsx(sheetsData()); }catch(e){ note('Could not build the Excel file. Try Copy for Google Sheets instead.', 'exportMsg'); return; }
    saveFile(blob, fileBase()+'.xlsx', 'exportMsg');
  }

  function restore(input){
    const f = input.files && input.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      let x = null; try{ x = normalize(JSON.parse(r.result)); }catch(e){}
      if(!x){ note('That file is not a Trip Split backup.'); return; }
      if(!confirm('Replace what is on this phone with "'+x.name+'" ('+x.expenses.length+' expenses)?')){ input.value=''; return; }
      state = x; editingId = null; form = blankForm(); openRows.clear(); persist(); render(); note('Backup restored.');
    };
    r.onerror = () => note('Could not read that file.');
    r.readAsText(f);
  }

  document.title = state.name || 'Trip Split';
  render();
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
